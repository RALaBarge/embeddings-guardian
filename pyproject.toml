[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embeddings-guardian"
version = "0.1.0"
description = "Open-source RAG poisoning detection. OWASP LLM08:2025 reference implementation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "BeigeBox AI", email = "security@beigebox.ai"},
]
keywords = [
    "rag",
    "embeddings",
    "poisoning",
    "security",
    "vector-database",
    "anomaly-detection",
    "owasp",
    "llm",
    "ai-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
chromadb = ["chromadb>=0.4"]
pinecone = ["pinecone-client>=3.0"]
weaviate = ["weaviate-client>=4.0"]
qdrant = ["qdrant-client>=2.0"]
milvus = ["pymilvus>=2.3"]
pgvector = ["psycopg[binary]>=3.1"]
faiss = ["faiss-cpu>=1.7"]
all = [
    "chromadb>=0.4",
    "pinecone-client>=3.0",
    "weaviate-client>=4.0",
    "qdrant-client>=2.0",
    "pymilvus>=2.3",
    "psycopg[binary]>=3.1",
    "faiss-cpu>=1.7",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/beigebox-ai/embeddings-guardian"
Documentation = "https://github.com/beigebox-ai/embeddings-guardian/tree/main/docs"
Repository = "https://github.com/beigebox-ai/embeddings-guardian"
Issues = "https://github.com/beigebox-ai/embeddings-guardian/issues"
Changelog = "https://github.com/beigebox-ai/embeddings-guardian/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["embeddings_guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast unit tests",
    "integration: component integration tests",
    "slow: tests that take >1s",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
